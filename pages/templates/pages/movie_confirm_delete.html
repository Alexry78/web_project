{% extends 'pages/base.html' %}

{% block title %}Удаление фильма{% endblock %}

{% block content %}
<div class="container py-5">
    <h1>Удалить фильм "{{ object.title }}"?</h1>
    <p>Вы уверены? Это действие необратимо.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'movie_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
