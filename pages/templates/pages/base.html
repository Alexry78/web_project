<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Мой сайт{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hero-soft-blue {
            background-color: #b1dfe5;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container">
            <a class="navbar-brand" href="#">Название проекта</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Главная</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'about' %}">О нас</a></li>
         <li class="nav-item"><a class="nav-link" href="#">Категории</a></li>
         <li class="nav-item"><a class="nav-link" href="#">Войти</a></li>
        </ul>
                </ul>
            </div>
        </div>
    </nav>

    <main>
        {% block content %}
        <!-- Сюда будет подставляться контент дочерних шаблонов -->
        {% endblock %}
    </main>

    <footer class="bg-dark text-white text-center py-4 mt-5">
        <div class="container">
            <p>&copy; 2024 Название проекта. Все права защищены.</p>
            <p>
                <a href="#" class="text-white text-decoration-none me-3">Facebook</a>
                <a href="#" class="text-white text-decoration-none me-3">Twitter</a>
                <a href="#" class="text-white text-decoration-none">Instagram</a>
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
